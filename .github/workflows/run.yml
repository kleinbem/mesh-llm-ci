name: Run

# Runs a bash script against a Mesh-LLM fork commit, for checks check.yml's
# fixed lanes can't express: a test with extra environment or a fake fixture,
# a built binary's output, a race repeated under load. Started with
# `gh workflow run run.yml -R kleinbem/mesh-llm-ci -f ref=<full sha> -f script=...`.
# Only collaborators can dispatch, and the job holds no secrets, so the script
# gets no more than a pushed workflow would.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Repository to check out (owner/name)
        default: kleinbem/mesh-llm
        required: true
      ref:
        description: Full commit SHA (take it from git or the API), branch or tag
        required: true
      platform:
        description: Runner platform
        type: choice
        options: [linux, macos, windows]
        default: linux
        required: true
      script:
        description: Bash script, run from the checkout root with `set -euo pipefail`
        required: true
      toolchain:
        description: Rust toolchain; match upstream's runner image (its Clippy job log prints the cargo version)
        default: "1.98.1"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The repository routes rustc through sccache; keep it, cached in this repo.
  SCCACHE_GHA_ENABLED: "true"
  # skippy-ffi builds a static CPU llama.cpp itself (cached below).
  LLAMA_STAGE_BACKEND: cpu

jobs:
  run:
    name: Run (${{ inputs.platform }})
    runs-on: ${{ inputs.platform == 'macos' && 'macos-15' || inputs.platform == 'windows' && 'windows-2025' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate inputs
        env:
          REPO: ${{ inputs.repo }}
          REF: ${{ inputs.ref }}
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          set -euo pipefail
          [[ "$REPO" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid repo"; exit 1; }
          [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::invalid ref"; exit 1; }
          [[ "$TOOLCHAIN" =~ ^(stable|beta|nightly|[0-9]+\.[0-9]+(\.[0-9]+)?)$ ]] || { echo "::error::invalid toolchain"; exit 1; }

      - name: Free disk space
        if: ${{ inputs.platform == 'linux' }}
        # Large test crates (mesh-llm-host-runtime) don't fit a standard runner otherwise.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Platform setup as in check.yml's platform rows.
      - uses: ./.github/actions/setup-windows-short-paths
        if: ${{ inputs.platform == 'windows' }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ inputs.toolchain }}
      - name: Configure macOS linker
        if: ${{ inputs.platform == 'macos' }}
        uses: ./.github/actions/setup-macos-lld
      - name: Install macOS build dependencies
        if: ${{ inputs.platform == 'macos' }}
        run: brew install cmake ninja
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: ${{ inputs.platform == 'windows' }}
        with:
          arch: x64
      - name: Cache the llama.cpp build
        if: ${{ inputs.platform != 'windows' }}
        # Restore only: the script may change .deps, and check.yml reuses the key.
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .deps
          key: llama-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('skippy/llama_cpp/upstream.txt', 'skippy/llama_cpp/patches/**', 'skippy/scripts/build-llama.sh', 'skippy/scripts/prepare-llama.sh') }}

      # After the checked-out repository's own setup actions: sccache-action
      # exports the cache token to every later step.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Script
        env:
          SCRIPT: ${{ inputs.script }}
          # sccache-action exported the cache token for later steps; the script
          # gets none, so it can't write cache entries check.yml restores.
          # sccache falls back to its local disk cache.
          SCCACHE_GHA_ENABLED: "false"
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_CACHE_URL: ""
        run: |
          printf '%s\n' "$SCRIPT" > "$RUNNER_TEMP/script.sh"
          echo "::group::script"; cat "$RUNNER_TEMP/script.sh"; echo "::endgroup::"
          [[ -z ${ACTIONS_RUNTIME_TOKEN:-} ]] || { echo "::error::cache token still set"; exit 1; }
          bash -euo pipefail "$RUNNER_TEMP/script.sh"
