name: Check

# Pre-flight checks for a Mesh-LLM fork commit before (or while) an upstream PR
# waits for CI approval. Upstream's own planner (`xtask ci plan`) decides, as in
# upstream's PR lanes, which crates get Clippy and tests and which platform rows
# run. Started by hand or with
# `gh workflow run check.yml -R kleinbem/mesh-llm-ci -f ref=<full sha>`.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Repository to check out (owner/name)
        default: kleinbem/mesh-llm
        required: true
      ref:
        description: Full commit SHA (take it from git or the API), branch or tag
        required: true
      upstream:
        description: Upstream repository whose main is the base
        default: Mesh-LLM/mesh-llm
        required: true
      packages:
        description: '"auto" = upstream planner; or space-separated Cargo packages to test on every platform'
        default: auto
        required: true
      title:
        description: Optional PR title to check like the squash commit subject
        default: ""
        required: false
      toolchain:
        description: Rust toolchain; match upstream's runner image (its Clippy job log prints the cargo version)
        default: "1.98.1"
        required: true

permissions:
  contents: read

concurrency:
  group: check-${{ inputs.repo }}-${{ inputs.ref }}-${{ inputs.packages }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The repository routes rustc through sccache; keep it, cached in this repo.
  SCCACHE_GHA_ENABLED: "true"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      base: ${{ steps.plan.outputs.base }}
      clippy: ${{ steps.plan.outputs.clippy }}
      tests: ${{ steps.plan.outputs.tests }}
      platforms: ${{ steps.plan.outputs.platforms }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - name: Validate inputs
        env:
          REPO: ${{ inputs.repo }}
          REF: ${{ inputs.ref }}
          UPSTREAM: ${{ inputs.upstream }}
          PACKAGES: ${{ inputs.packages }}
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          set -euo pipefail
          [[ "$REPO" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid repo"; exit 1; }
          [[ "$UPSTREAM" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid upstream"; exit 1; }
          [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::invalid ref"; exit 1; }
          [[ "$PACKAGES" =~ ^[A-Za-z0-9_\ -]+$ ]] || { echo "::error::invalid packages"; exit 1; }
          [[ "$TOOLCHAIN" =~ ^(stable|beta|nightly|[0-9]+\.[0-9]+(\.[0-9]+)?)$ ]] || { echo "::error::invalid toolchain"; exit 1; }

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ inputs.toolchain }}

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - id: plan
        name: Run upstream's planner
        env:
          UPSTREAM: ${{ inputs.upstream }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          git fetch --quiet "https://github.com/$UPSTREAM" main
          base=$(git merge-base FETCH_HEAD HEAD)
          head=$(git rev-parse HEAD)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          git diff --name-only "$base" "$head" > "$RUNNER_TEMP/changed.txt"
          echo "Changed files against $UPSTREAM main (merge base ${base:0:12}):"
          cat "$RUNNER_TEMP/changed.txt"
          cargo build --locked -p xtask --bin xtask --quiet
          manifests=$(mktemp -d)
          git archive --format=tar HEAD -- ci/ownership.yml ci/slices.yml | tar -x -C "$manifests"
          jq -Rsc --arg base "$base" --arg head "$head" \
            '{profile: "pr-ready", event_name: "pull_request", source_sha: $head, base_sha: $base,
              changed_files: (split("\n") | map(select(length > 0)))}' "$RUNNER_TEMP/changed.txt" \
            | target/debug/xtask ci plan --manifest-root "$manifests" > "$RUNNER_TEMP/plan.json"
          jq -c '{domains, required_slices}' "$RUNNER_TEMP/plan.json"
          if [ "$PACKAGES" = auto ]; then
            clippy=$(jq -c '[.matrices.clippy[].crates[]] | unique' "$RUNNER_TEMP/plan.json")
            tests=$(jq -c '{include: [.matrices.rust_tests[] | {id, crates: (.crates | join(" "))}]}' "$RUNNER_TEMP/plan.json")
            packages=$(jq -r '.direct_crates | join(" ")' "$RUNNER_TEMP/plan.json")
            platforms=$(jq -c '[.matrices.platform_checks[] | select(.kind == "unit") | .platform] | unique' "$RUNNER_TEMP/plan.json")
          else
            clippy=$(jq -Rc 'split(" ") | map(select(length > 0))' <<<"$PACKAGES")
            tests=$(jq -Rc '{include: [{id: "packages", crates: .}]}' <<<"$PACKAGES")
            packages="$PACKAGES"
            platforms='["macos","windows"]'
          fi
          {
            echo "clippy=$clippy"
            echo "tests=$tests"
            echo "packages=$packages"
            echo "platforms=$(jq -c '{include: [.[] | if . == "macos" then {platform: ., os: "macos-15"} else {platform: ., os: "windows-2022"} end]}' <<<"$platforms")"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Plan for \`${head:0:12}\`"
            echo "- Base: \`$UPSTREAM\` main, merge base \`${base:0:12}\`"
            echo "- Domains: $(jq -r '.domains | join(", ")' "$RUNNER_TEMP/plan.json")"
            echo "- Clippy: $(jq -r 'join(" ")' <<<"$clippy")"
            echo "- Test batches: $(jq -r '[.include[].crates] | join(" | ")' <<<"$tests")"
            echo "- Platform rows: $(jq -r 'join(", ")' <<<"$platforms") (directly changed crates: ${packages:-none})"
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Quality
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LLAMA_STAGE_BACKEND: cpu
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ inputs.toolchain }}
          components: clippy, rustfmt
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Cache the llama.cpp build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .deps
          key: llama-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('skippy/llama_cpp/upstream.txt', 'skippy/llama_cpp/patches/**', 'skippy/scripts/build-llama.sh', 'skippy/scripts/prepare-llama.sh') }}
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-machete@0.9.2
      - name: Rust format
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check
      - name: Commit convention
        if: ${{ !cancelled() }}
        env:
          UPSTREAM: ${{ inputs.upstream }}
          BASE: ${{ needs.plan.outputs.base }}
          TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail
          cargo build --locked -p xtask --bin xtask --quiet
          target/debug/xtask repository conventional-commits --range "$BASE..HEAD"
          if [ -n "$TITLE" ]; then
            target/debug/xtask repository conventional-commits --message "$TITLE"
          fi
      - name: Clippy (planned crates)
        if: ${{ !cancelled() && needs.plan.outputs.clippy != '[]' }}
        env:
          CRATES: ${{ needs.plan.outputs.clippy }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r c; do args+=(-p "$c"); done < <(jq -r '.[]' <<<"$CRATES")
          cargo clippy --locked "${args[@]}" --all-targets -- -D warnings
      - name: CI contracts and consistency
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          target/debug/xtask repo-consistency no-console-print
          target/debug/xtask repository env-mutation-census
          target/debug/xtask repo-consistency ci-crate-lists
      - name: Unused dependencies
        if: ${{ !cancelled() }}
        run: cargo machete

  rust-tests:
    name: Rust tests (${{ matrix.id }})
    needs: plan
    if: ${{ needs.plan.outputs.tests != '{"include":[]}' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.tests) }}
    env:
      # skippy-ffi builds a static CPU llama.cpp itself (cached below).
      LLAMA_STAGE_BACKEND: cpu
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ inputs.toolchain }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Cache the llama.cpp build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .deps
          key: llama-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('skippy/llama_cpp/upstream.txt', 'skippy/llama_cpp/patches/**', 'skippy/scripts/build-llama.sh', 'skippy/scripts/prepare-llama.sh') }}
      - name: Tests
        env:
          CRATES: ${{ matrix.crates }}
        run: |
          set -euo pipefail
          for c in $CRATES; do
            echo "::group::cargo test -p $c"
            cargo test --locked -p "$c"
            echo "::endgroup::"
          done

  platform:
    name: ${{ matrix.platform }} unit tests
    needs: plan
    if: ${{ needs.plan.outputs.platforms != '{"include":[]}' && needs.plan.outputs.packages != '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.platforms) }}
    defaults:
      run:
        shell: bash
    env:
      # macOS: skippy-ffi builds a static CPU llama.cpp itself (cached below).
      LLAMA_STAGE_BACKEND: cpu
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Platform setup as in upstream's platform checks, using the checked-out
      # repository's own actions.
      - uses: ./.github/actions/setup-windows-short-paths
        if: ${{ matrix.platform == 'windows' }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ inputs.toolchain }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Configure macOS linker
        if: ${{ matrix.platform == 'macos' }}
        uses: ./.github/actions/setup-macos-lld
      - name: Install macOS build dependencies
        if: ${{ matrix.platform == 'macos' }}
        run: brew install cmake ninja
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: ${{ matrix.platform == 'windows' }}
        with:
          arch: x64
      - name: Cache the llama.cpp build
        if: ${{ matrix.platform == 'macos' }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .deps
          key: llama-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('skippy/llama_cpp/upstream.txt', 'skippy/llama_cpp/patches/**', 'skippy/scripts/build-llama.sh', 'skippy/scripts/prepare-llama.sh') }}
      - name: Tests of the directly changed crates
        env:
          PACKAGES: ${{ needs.plan.outputs.packages }}
          # Not PLATFORM: Windows env names are case-insensitive, and msvc-dev-cmd
          # sets Platform=x64.
          CHECK_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          for c in $PACKAGES; do
            args=(-p "$c" --lib)
            # As upstream's Windows unit row: skippy-ffi's llama.cpp build script
            # doesn't run on Windows, so crates that reach it use the dynamic
            # native runtime, whose build script returns early.
            if [ "$CHECK_PLATFORM" = windows ]; then
              case "$c" in mesh-llm-system|mesh-llm-commands) args+=(--features mesh-llm-system/dynamic-native-runtime) ;; esac
            fi
            echo "::group::cargo test ${args[*]}"
            cargo test --locked "${args[@]}"
            echo "::endgroup::"
          done
