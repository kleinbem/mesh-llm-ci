name: Check

# Runs Clippy and the tests of selected Mesh-LLM crates for one commit of a fork,
# on GitHub's Linux, macOS and Windows runners. Started by hand or with
# `gh workflow run check.yml -R kleinbem/mesh-llm-ci -f ref=<sha> -f packages="<crates>"`.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Repository to check out (owner/name)
        default: kleinbem/mesh-llm
        required: true
      ref:
        description: Commit SHA, branch or tag
        required: true
      packages:
        description: Space-separated Cargo packages, e.g. "mesh-llm-system skippy-protocol"
        default: mesh-llm-system
        required: true
      platforms:
        description: Platforms to run on
        type: choice
        default: all
        options: [all, windows, macos, linux, windows+macos]
      features:
        description: Cargo features; "auto" turns on mesh-llm-system/dynamic-native-runtime when the packages need it, "none" for no extra features
        default: auto
        required: true
      tests:
        description: Run the tests after Clippy
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: check-${{ inputs.repo }}-${{ inputs.ref }}-${{ inputs.platforms }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        name: Validate inputs and select platforms
        shell: bash
        env:
          REPO: ${{ inputs.repo }}
          REF: ${{ inputs.ref }}
          PACKAGES: ${{ inputs.packages }}
          PLATFORMS: ${{ inputs.platforms }}
          FEATURES: ${{ inputs.features }}
        run: |
          set -euo pipefail
          [[ "$FEATURES" =~ ^[A-Za-z0-9_/,\ -]+$ ]] || { echo "::error::invalid features: $FEATURES"; exit 1; }
          [[ "$REPO" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid repo: $REPO"; exit 1; }
          [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::invalid ref: $REF"; exit 1; }
          [[ "$PACKAGES" =~ ^[A-Za-z0-9_\ -]+$ ]] || { echo "::error::invalid packages: $PACKAGES"; exit 1; }
          # The runner images upstream's platform checks use.
          linux='{"platform":"linux","os":"ubuntu-24.04"}'
          macos='{"platform":"macos","os":"macos-15"}'
          windows='{"platform":"windows","os":"windows-2022"}'
          case "$PLATFORMS" in
            all) rows="$linux,$macos,$windows" ;;
            windows) rows="$windows" ;;
            macos) rows="$macos" ;;
            linux) rows="$linux" ;;
            windows+macos) rows="$macos,$windows" ;;
            *) echo "::error::invalid platforms: $PLATFORMS"; exit 1 ;;
          esac
          echo "matrix={\"include\":[$rows]}" >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.platform }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CARGO_TERM_COLOR: always
      # The repository routes rustc through sccache; keep it, cached in this repo.
      SCCACHE_GHA_ENABLED: "true"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Platform setup as in upstream's platform checks (ci-platform-checks-slice.yml),
      # using the checked-out repository's own actions.
      - uses: ./.github/actions/setup-windows-short-paths
        if: ${{ matrix.platform == 'windows' }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Configure macOS linker
        if: ${{ matrix.platform == 'macos' }}
        uses: ./.github/actions/setup-macos-lld

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: ${{ matrix.platform == 'windows' }}
        with:
          arch: x64

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ inputs.packages }}

      - name: Show the checked-out commit and resolve features
        id: features
        env:
          PACKAGES: ${{ inputs.packages }}
          FEATURES: ${{ inputs.features }}
        run: |
          set -euo pipefail
          git log -1 --format='%H %s'
          rustc --version
          # As upstream's Windows unit row: with the dynamic native runtime,
          # skippy-ffi's build script returns early, so no llama.cpp build is
          # needed (upstream's macOS row builds a static Metal llama.cpp instead).
          case "$FEATURES" in
            auto)
              features=""
              for p in $PACKAGES; do
                case "$p" in mesh-llm-system|mesh-llm-commands) features="mesh-llm-system/dynamic-native-runtime" ;; esac
              done ;;
            none) features="" ;;
            *) features="$FEATURES" ;;
          esac
          echo "features=$features" >> "$GITHUB_OUTPUT"
          echo "Features: ${features:-<none>}"

      - name: Clippy
        env:
          PACKAGES: ${{ inputs.packages }}
          FEATURES: ${{ steps.features.outputs.features }}
        run: |
          set -euo pipefail
          args=()
          for p in $PACKAGES; do args+=(-p "$p"); done
          [ -z "$FEATURES" ] || args+=(--features "$FEATURES")
          cargo clippy --locked "${args[@]}" --all-targets -- -D warnings

      - name: Tests
        if: ${{ inputs.tests }}
        env:
          PACKAGES: ${{ inputs.packages }}
          FEATURES: ${{ steps.features.outputs.features }}
        run: |
          set -euo pipefail
          args=()
          for p in $PACKAGES; do args+=(-p "$p"); done
          [ -z "$FEATURES" ] || args+=(--features "$FEATURES")
          cargo test --locked "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/test.log"
          {
            echo "### ${{ matrix.platform }}: \`$(git rev-parse --short HEAD)\`"
            grep -E '^test result:' "$RUNNER_TEMP/test.log" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
